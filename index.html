<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแรก | Student Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --purple-bright: #d8b4fe;
            --purple-neon: #c084fc;
            --purple-glow: rgba(192, 132, 252, 0.6);
            --purple-intense: #a855f7;
            --bg-card: rgba(15, 7, 26, 0.75);
            --border-purple: rgba(192, 132, 252, 0.4);
            --text-primary: #ffffff;
            --text-muted: #e9d5ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Prompt', sans-serif;
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            background-color: #05020a;
            background-image: linear-gradient(rgba(5, 2, 10, 0.😎, rgba(5, 2, 10, 0.9)), url('images/shadow-bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -20%; left: -20%;
            width: 140%; height: 140%;
            background: radial-gradient(circle at 20% 30%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(192, 132, 252, 0.12) 0%, transparent 50%);
            z-index: -2;
            pointer-events: none;
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) rotate(0deg); opacity: 0.7; }
            100% { transform: scale(1.1) rotate(3deg); opacity: 1; }
        }

        #neon-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        a { text-decoration: none; transition: all 0.3s ease; }

        .navbar-header {
            background: rgba(10, 4, 18, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-purple);
            position: sticky; top: 0;
            z-index: 1000;
            box-shadow: 0 4px 25px rgba(168, 85, 247, 0.2);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.2rem 2rem;
        }

        .nav-logo {
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .nav-logo span {
            color: var(--purple-neon);
            text-shadow: 0 0 15px var(--purple-neon), 0 0 30px var(--purple-intense);
        }

        .nav-menu { list-style: none; display: flex; gap: 2rem; }
        .nav-link { color: var(--text-muted); font-weight: 400; position: relative; }
        .nav-link::after {
            content: ''; position: absolute; bottom: -5px; left: 0;
            width: 0%; height: 2px;
            background: var(--purple-neon);
            box-shadow: 0 0 10px var(--purple-neon);
            transition: width 0.3s ease;
        }
        .nav-link:hover::after, .nav-link.active::after { width: 100%; }
        .nav-link:hover, .nav-link.active { color: #fff; text-shadow: 0 0 12px var(--purple-neon); }

        .main-content { max-width: 1200px; margin: 0 auto; padding: 3rem 2rem; min-height: 60vh;}
        
        .btn { padding: 0.8rem 1.8rem; border-radius: 12px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.3s ease; }
        .btn-atomic {
            background: #000; color: #c084fc; border: 2px solid #c084fc;
            box-shadow: 0 0 15px #c084fc, inset 0 0 10px rgba(192, 132, 252, 0.3);
            position: relative; overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            margin-top: 2rem;
        }
        .btn-atomic:hover {
            background: #c084fc; color: #000;
            box-shadow: 0 0 40px #c084fc, 0 0 80px rgba(192, 132, 252, 0.6);
            transform: scale(1.05); font-weight: 700;
        }

        .site-footer {
            background: rgba(8, 3, 15, 0.95); border-top: 1px solid var(--border-purple);
            padding: 3rem 0 1.5rem; margin-top: 5rem; backdrop-filter: blur(10px);
            box-shadow: 0 -10px 30px rgba(168, 85, 247, 0.1);
        }
        .footer-bottom { text-align: center; padding-top: 1.5rem; border-top: 1px solid rgba(255, 255, 255, 0.08); color: var(--text-muted); font-size: 0.85rem; }

        /* ================= ATOMIC OVERLAY & GLASS SHATTER ================= */
        #atomic-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(2, 0, 5, 0.92); z-index: 999998;
            display: none; justify-content: center; align-items: center; overflow: hidden; pointer-events: none;
        }
        #atomic-overlay.active { display: flex; pointer-events: auto; }
        #shatter-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 999999; pointer-events: none; display: none; }

        /* ================= TIME REWIND CLOCK FX ================= */
        #time-rewind-clock {
            position: absolute; top: 50%; left: 50%; width: 380px; height: 380px;
            margin-top: -190px; margin-left: -190px; border-radius: 50%;
            border: 2px solid rgba(192, 132, 252, 0.6);
            box-shadow: 0 0 40px #c084fc, inset 0 0 30px #a855f7;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, rgba(5, 2, 10, 0.6) 70%);
            z-index: 5; opacity: 0; transform: scale(0.5) rotate(0deg);
            transition: opacity 0.5s ease, transform 0.8s cubic-bezier(0.1, 0.8, 0.2, 1); pointer-events: none;
        }
        #atomic-overlay.exploding #time-rewind-clock { opacity: 1; transform: scale(1) rotate(-180deg); }
        .clock-face { position: relative; width: 100%; height: 100%; }
        .clock-num { position: absolute; font-family: 'Cinzel', serif; font-size: 1.4rem; font-weight: 700; color: #e9d5ff; text-shadow: 0 0 12px #c084fc; }
        .num-12 { top: 15px; left: 50%; transform: translateX(-50%); }
        .num-3  { right: 20px; top: 50%; transform: translateY(-50%); }
        .num-6  { bottom: 15px; left: 50%; transform: translateX(-50%); }
        .num-9  { left: 20px; top: 50%; transform: translateY(-50%); }
        .clock-hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom center; background: #ffffff; border-radius: 4px; box-shadow: 0 0 15px #c084fc, 0 0 25px #a855f7; }
        .hand-hour { width: 6px; height: 90px; margin-left: -3px; }
        .hand-minute { width: 4px; height: 130px; margin-left: -2px; }
        .clock-center { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; margin-top: -8px; margin-left: -8px; border-radius: 50%; background: #fff; box-shadow: 0 0 15px #c084fc; }

        .slash-effect {
            position: absolute; top: 50%; left: -20%; width: 140%; height: 12px; margin-top: -6px;
            background: linear-gradient(90deg, transparent 0%, #ffffff 30%, #e9d5ff 50%, #ffffff 70%, transparent 100%);
            box-shadow: 0 0 25px #ffffff, 0 0 50px #c084fc, 0 0 100px #a855f7;
            transform-origin: center center; transform: rotate(-5deg) scaleX(0); opacity: 0; z-index: 100; pointer-events: none;
        }
        #atomic-overlay.slashing .slash-effect { animation: slashTrigger 0.18s cubic-bezier(0.05, 0.9, 0.1, 1) forwards; }
        @keyframes slashTrigger {
            0% { transform: rotate(-5deg) scaleX(0); opacity: 1; }
            50% { opacity: 1; height: 18px; }
            100% { transform: rotate(-5deg) scaleX(1); opacity: 0.8; height: 4px; }
        }

        .shockwave-effect {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(192,132,252,0.9) 30%, rgba(168,85,247,0.5) 60%, transparent 80%);
            transform: translate(-50%, -50%) scale(0); opacity: 0; z-index: 50; pointer-events: none;
        }
        #atomic-overlay.exploding .shockwave-effect { animation: atomicExplode 1.2s cubic-bezier(0.08, 0.82, 0.17, 1) forwards; }
        @keyframes atomicExplode {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            25% { opacity: 1; box-shadow: 0 0 120px #c084fc, 0 0 250px #a855f7, inset 0 0 100px #fff; }
            100% { transform: translate(-50%, -50%) scale(280); opacity: 0; }
        }

        .atomic-text-wrapper {
            position: relative; font-family: 'Cinzel', serif; font-size: 4.8rem; font-weight: 900;
            color: #ffffff; z-index: 10; letter-spacing: 12px; display: flex; gap: 1.5rem;
        }
        .word-group {
            display: flex; opacity: 0; transform: scale(0.8);
            transition: opacity 0.25s ease-out, transform 0.25s ease-out, filter 0.25s ease-out; filter: blur(8px);
        }
        .word-group.show { opacity: 1; transform: scale(1); filter: blur(0px); text-shadow: 0 0 20px #c084fc, 0 0 40px #a855f7; }
        .shatter-char { display: inline-block; transition: transform 0.8s cubic-bezier(0.1, 0.8, 0.2, 1), opacity 0.7s ease-out, filter 0.7s ease-out; }
    </style>
</head>
<body>

    <audio id="atomic-sound" src="atomic.mp3" preload="auto" playsinline></audio>
    <canvas id="neon-canvas"></canvas>
    <canvas id="shatter-canvas"></canvas>

    <div id="atomic-overlay">
        <div class="slash-effect"></div>
        <div class="shockwave-effect"></div>
        <div class="shockwave-effect"></div>
        <div id="time-rewind-clock">
            <div class="clock-face">
                <span class="clock-num num-12">XII</span>
                <span class="clock-num num-3">III</span>
                <span class="clock-num num-6">VI</span>
                <span class="clock-num num-9">IX</span>
                <div class="clock-hand hand-hour" id="clock-hour"></div>
                <div class="clock-hand hand-minute" id="clock-minute"></div>
                <div class="clock-center"></div>
            </div>
        </div>

        <div class="atomic-text-wrapper">
            <div class="word-group word-i" id="w-i"><span class="shatter-char">I</span></div>
            <div class="word-group word-am" id="w-am"><span class="shatter-char">A</span><span class="shatter-char">M</span></div>
            <div class="word-group word-atomic" id="w-atomic">
                <span class="shatter-char">A</span><span class="shatter-char">T</span><span class="shatter-char">O</span><span class="shatter-char">M</span><span class="shatter-char">I</span><span class="shatter-char">C</span>
            </div>
        </div>
    </div>

    <header class="navbar-header">
        <nav class="navbar">
            <a href="index.html" class="nav-logo">PORTFOLIO<span>.M3</span></a>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link active">หน้าแรก</a></li>
                <li><a href="profile.html" class="nav-link">ประวัติส่วนตัว</a></li>
                <li><a href="education.html" class="nav-link">การศึกษา</a></li>
                <li><a href="hobby.html" class="nav-link">งานอดิเรก</a></li>
                <li><a href="contact.html" class="nav-link">ติดต่อ</a></li>
            </ul>
        </nav>
    </header>

    <!-- พื้นที่เนื้อหาหลัก -->
    <main class="main-content">
        <!-- ปุ่มจำลองสำหรับเริ่มเอฟเฟกต์ -->
        <button id="btn-atomic-power" class="btn btn-atomic">ทดสอบเอฟเฟกต์ I AM ATOMIC (หรือกด F5)</button>
    </main>

    <footer class="site-footer">
        <div class="footer-bottom">
            <p>&copy; 2026 Student Portfolio Project. All Rights Reserved.</p>
        </div>
    </footer>

    <script>
        const neonCanvas = document.getElementById('neon-canvas');
        const neonCtx = neonCanvas.getContext('2d');
        let bgParticles = [];

        function resizeCanvas() {
            neonCanvas.width = window.innerWidth;
            neonCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function animateBgParticles() {
            neonCtx.clearRect(0, 0, neonCanvas.width, neonCanvas.height);
            bgParticles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateBgParticles);
        }
        animateBgParticles();

        const shatterCanvas = document.getElementById('shatter-canvas');
        const sCtx = shatterCanvas.getContext('2d');
        let shards = [];
        let shatterAnimId = null;

        function initShatterCanvas() {
            shatterCanvas.width = window.innerWidth;
            shatterCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', initShatterCanvas);
        initShatterCanvas();

        function createShards() {
            shards = [];
            const w = shatterCanvas.width;
            const h = shatterCanvas.height;
            const rows = 12;
            const cols = 16;
            const cellW = w / cols;
            const cellH = h / rows;
            
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const x = c * cellW;
                    const y = r * cellH;
                    const centerX = x + cellW / 2;
                    const centerY = y + cellH / 2;
                    const angle = Math.atan2(centerY - h / 2, centerX - w / 2) + (Math.random() - 0.5) * 0.5;
                    const force = 15 + Math.random() * 35;

                    shards.push({
                        x: x, y: y, w: cellW, h: cellH, origX: x, origY: y,
                        vx: Math.cos(angle) * force, vy: Math.sin(angle) * force,
                        rot: 0, vRot: (Math.random() - 0.5) * 0.3, opacity: 1, progress: 0
                    });
                }
            }
        }

        function triggerShatterEffect(durationMs = 4200) {
            shatterCanvas.style.display = 'block';
            createShards();
            const startTime = performance.now();

            function renderShatter(now) {
                const elapsed = now - startTime;
                const halfDuration = durationMs / 2;
                sCtx.clearRect(0, 0, shatterCanvas.width, shatterCanvas.height);

                let phase = 0;
                if (elapsed < halfDuration) {
                    // ขาไป กระจกแตกกระจายออก (Phase 0 ถึง 1)
                    phase = Math.sin((elapsed / halfDuration) * (Math.PI / 2));
                } else if (elapsed < durationMs) {
                    // ขากลับ กระจกย้อนเวลากลับมาต่อกัน (Phase 1 ถึง 0)
                    let y = (elapsed - halfDuration) / halfDuration;
                    phase = Math.cos(y * (Math.PI / 2));
                } else {
                    sCtx.clearRect(0, 0, shatterCanvas.width, shatterCanvas.height);
                    shatterCanvas.style.display = 'none';
                    return;
                }

                shards.forEach(s => {
                    sCtx.save();
                    const currentX = s.origX + s.vx * phase * 15;
                    const currentY = s.origY + s.vy * phase * 15;
                    const currentRot = s.vRot * phase * 20;

                    sCtx.translate(currentX + s.w / 2, currentY + s.h / 2);
                    sCtx.rotate(currentRot);
                    sCtx.fillStyle = rgba(192, 132, 252, ${0.15 + phase * 0.45});
                    sCtx.strokeStyle = rgba(255, 255, 255, ${0.4 + phase * 0.6});
                    sCtx.lineWidth = 1.5;

                    sCtx.beginPath();
                    sCtx.rect(-s.w / 2, -s.h / 2, s.w, s.h);
                    sCtx.fill();
                    sCtx.stroke();
                    sCtx.restore();
                });
                shatterAnimId = requestAnimationFrame(renderShatter);
            }
            if (shatterAnimId) cancelAnimationFrame(shatterAnimId);
            shatterAnimId = requestAnimationFrame(renderShatter);
        }

        let clockAnimId = null;
        function startClockRewind(durationMs = 4200) {
            const hourHand = document.getElementById('clock-hour');
            const minuteHand = document.getElementById('clock-minute');
            if (!hourHand || !minuteHand) return;
            const startTime = performance.now();

            function animateClock(now) {
                const elapsed = now - startTime;
                if (elapsed <= durationMs) {
                    const progress = elapsed / durationMs;
                    minuteHand.style.transform = rotate(${-progress * 4320}deg);
                    hourHand.style.transform = rotate(${-progress * 360}deg);
                    clockAnimId = requestAnimationFrame(animateClock);
                } else {
                    minuteHand.style.transform = 'rotate(0deg)';
                    hourHand.style.transform = 'rotate(0deg)';
                }
            }
            if (clockAnimId) cancelAnimationFrame(clockAnimId);
            clockAnimId = requestAnimationFrame(animateClock);
        }

        document.addEventListener('DOMContentLoaded', function() {
            const btnAtomic = document.getElementById('btn-atomic-power');
            const overlay = document.getElementById('atomic-overlay');
            const sound = document.getElementById('atomic-sound');
            const wordI = document.getElementById('w-i');
            const wordAm = document.getElementById('w-am');
            const wordAtomic = document.getElementById('w-atomic');

            const handlePlay = function(e) {
                if (e) e.preventDefault();
                
                if (sound) {
                    sound.currentTime = 0;
                    sound.volume = 1.0;
                    sound.play().catch((error) => {
                        console.error("Audio error:", error);
                    });
                }

                overlay.classList.remove('active', 'slashing', 'exploding');
                wordI.classList.remove('show');
                wordAm.classList.remove('show');
                wordAtomic.classList.remove('show');

                overlay.classList.add('active');
                setTimeout(() => wordI.classList.add('show'), 200);
                setTimeout(() => wordAm.classList.add('show'), 1500);
                setTimeout(() => wordAtomic.classList.add('show'), 3000);
                setTimeout(() => overlay.classList.add('slashing'), 4200); 
                setTimeout(() => {
                    overlay.classList.add('exploding');
                    triggerShatterEffect(4200); 
                    startClockRewind(4200);
                }, 4500); 
                setTimeout(() => {
                    overlay.classList.remove('active', 'slashing', 'exploding');
                }, 9000);
            };

            // ดักจับการกดปุ่ม F5
            document.addEventListener('keydown', function(e) {
                if (e.key === 'F5' || e.keyCode === 116) {
                    e.preventDefault();
                    handlePlay();
                }
            });

            if (btnAtomic && overlay) {
                btnAtomic.addEventListener('touchstart', handlePlay, { passive: false });
                btnAtomic.addEventListener('click', handlePlay);
            }
        });
    </script>
</body>
</html>
